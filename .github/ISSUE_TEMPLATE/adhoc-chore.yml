name: "🧹 その他の家事（単発）"
description: 定期タスクにない家事を1件起票する
title: "[家事] "
labels: ["type/adhoc"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 領域
      description: 起票後に対応する area/* ラベルを付けると集計に乗る
      options:
        - 洗い物
        - 料理
        - 掃除
        - 育児
        - 名もなき家事
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: 見込み時間（分）
      placeholder: "20"
  - type: textarea
    id: checklist
    attributes:
      label: ✅ チェックリスト（任意）
      placeholder: |
        - [ ] 手順1
        - [ ] 手順2
  - type: markdown
    attributes:
      value: |
        完了したらコメントに `/done 実時間` を書いてクローズ。
