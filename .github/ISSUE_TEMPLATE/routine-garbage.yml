# Phase 0 用の手動起票テンプレート（Phase 1 で generate-tasks.yml に置き換える）
# 定義元: routines/daily.yml → garbage
name: "🗑 ゴミまとめ・ゴミ出し"
description: "毎日 朝 ・ core ・ 見込み 5分（W=1.35 → 換算 7分）"
title: "[名もなき家事] ゴミまとめ・ゴミ出し"
labels: ["area/nameless", "type/routine", "freq/daily", "core", "load/W1.35"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ チェックリスト
      options:
        - label: 今日の収集区分を確認する
        - label: 各部屋のゴミを集めて袋をまとめる
        - label: 新しい袋をセットする
        - label: 収集日なら集積所へ出す
  - type: input
    id: estimate
    attributes:
      label: 見込み
      value: "garbage ・ 5分 ・ W=1.35 → 換算 7分"
  - type: markdown
    attributes:
      value: |
        そのまま **Submit** でOK。完了したらコメントに `/done 実時間` を書いてクローズ（例: `/done 5`）。
