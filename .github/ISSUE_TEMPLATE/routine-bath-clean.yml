# Phase 0 用の手動起票テンプレート（Phase 1 で generate-tasks.yml に置き換える）
# 定義元: routines/daily.yml → bath-clean
name: "🚿 風呂掃除"
description: "毎日 ・ 見込み 10分（W=1.10 → 換算 11分）"
title: "[掃除] 風呂掃除"
labels: ["area/cleaning", "type/routine", "freq/daily", "load/W1.10"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ チェックリスト
      options:
        - label: 浴槽を洗う
        - label: 排水口の髪の毛を取る
        - label: 壁・床を流して水気を切り、換気扇を回す
  - type: input
    id: estimate
    attributes:
      label: 見込み
      value: "bath-clean ・ 10分 ・ W=1.10 → 換算 11分"
  - type: markdown
    attributes:
      value: |
        そのまま **Submit** でOK。完了したらコメントに `/done 実時間` を書いてクローズ（例: `/done 10`）。
