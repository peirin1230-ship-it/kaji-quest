# Phase 0 用の手動起票テンプレート（Phase 1 で generate-tasks.yml に置き換える）
# 定義元: routines/daily.yml → dishes-night
name: "🧽 夜の洗い物リセット"
description: "毎日 21:00 ・ core ・ 見込み 15分（W=1.20 → 換算 18分）"
title: "[洗い物] 夜の洗い物リセット"
labels: ["area/dishes", "type/routine", "freq/daily", "core", "load/W1.20"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ チェックリスト
      options:
        - label: 食器を洗う／食洗機を回す
        - label: シンクの水気を拭く
        - label: 排水口カゴを洗う
        - label: 三角コーナーのゴミを捨てる
  - type: input
    id: estimate
    attributes:
      label: 見込み
      value: "dishes-night ・ 15分 ・ W=1.20 → 換算 18分"
  - type: markdown
    attributes:
      value: |
        そのまま **Submit** でOK。完了したらコメントに `/done 実時間` を書いてクローズ（例: `/done 18`）。
