# site/ と routines/・config.yml を GitHub Pages へ配信する。
# 初回だけ Settings → Pages → Source を「GitHub Actions」にする（configure-pages の enablement でも試みる）。
# ページが logs/ に書くコミットは [skip ci] 付きで、paths にも当たらないので、この workflow は動かない。
name: build-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "routines/**"
      - "config.yml"
      - "scripts/build_site.py"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/build_site.py _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
