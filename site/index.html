<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="kaji-quest">
<title>kaji-quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="datebar">
    <button class="icon-btn" id="btn-date-prev" aria-label="前の日">‹</button>
    <input type="date" id="date-input" aria-label="日付">
    <span class="dow" id="date-dow"></span>
    <button class="icon-btn" id="btn-date-next" aria-label="次の日">›</button>
    <button class="ghost small" id="btn-today" hidden>今日へ</button>
  </div>
  <div class="tools">
    <span class="streak" id="streak">🔥 —</span>
    <button class="icon-btn" id="btn-reload" aria-label="更新" title="更新">↻</button>
    <button class="icon-btn" id="btn-settings" aria-label="設定" title="設定">⚙️</button>
  </div>
</header>

<main id="app">
  <section class="card" id="search">
    <input type="search" id="q" placeholder="検索: タスク・メニュー・コツ・記録" autocomplete="off" autocapitalize="off">
    <div id="search-results"></div>
  </section>
  <section class="card" id="progress"></section>
  <section class="card" id="tasks"><p class="empty">読み込み中…</p></section>
  <section class="card" id="menu"></section>
  <section class="card" id="tip"></section>
  <section class="card" id="basics"></section>
  <section class="card" id="quick"></section>
  <section class="card" id="refill"></section>
  <section class="card" id="week"></section>
  <section class="card" id="achievements"></section>
  <section class="card" id="today-log"></section>
</main>

<footer class="foot">
  <a id="repo-link" href="#" target="_blank" rel="noopener">リポジトリ</a> ・
  <a id="supplies-link" href="#" target="_blank" rel="noopener">洗剤と道具</a> ・
  <a id="spec-link" href="#" target="_blank" rel="noopener">仕様書</a>
</footer>

<dialog id="dlg-detail">
  <h3><span id="detail-title"></span> <span class="sub" id="detail-w"></span></h3>
  <div class="field" id="detail-check-wrap">
    <label>やること</label>
    <ul class="check" id="detail-check"></ul>
  </div>
  <div class="field" id="detail-tip-wrap" hidden>
    <label>💡 コツ</label>
    <div class="tip" id="detail-tip"></div>
    <label class="chk"><input type="checkbox" id="detail-tip-practiced"> このコツを実践した</label>
  </div>
  <div class="field">
    <label>所要時間</label>
    <div class="chips" id="detail-minutes"></div>
    <input type="number" id="detail-custom" inputmode="numeric" min="1" max="600" placeholder="それ以外なら分を入力">
  </div>
  <div class="field">
    <label>時間帯</label>
    <div class="chips" id="detail-slot"></div>
  </div>
  <div class="field">
    <label>気分（任意）</label>
    <div class="chips" id="detail-mood"></div>
  </div>
  <div class="field">
    <label>気づき（1行・任意）</label>
    <input type="text" id="detail-note" maxlength="140" placeholder="先に鍋を浸けておくと早い">
  </div>
  <div class="actions">
    <button type="button" class="ghost" id="detail-cancel">やめる</button>
    <button type="button" class="ghost" id="detail-partial">70点で完了</button>
    <button type="button" class="primary" id="detail-done">完了</button>
  </div>
</dialog>

<dialog id="dlg-settings">
  <h3>設定</h3>
  <p class="help">記録を書き込むには GitHub のトークンが要る（初回だけ）。<br>
    <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Fine-grained token を作る</a>
    → Repository access: <b>Only select repositories → kaji-quest</b> ／ Permissions: <b>Contents → Read and write</b></p>
  <label class="field-label" for="token">トークン</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
  <div class="status" id="settings-status"></div>
  <div class="actions">
    <button type="button" class="ghost" id="settings-close">閉じる</button>
    <button type="button" class="ghost" id="settings-test">確認</button>
    <button type="button" class="primary" id="settings-save">保存</button>
  </div>
  <p class="help small">トークンはこの端末のブラウザにだけ保存され、GitHub API 以外には送らない。</p>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
