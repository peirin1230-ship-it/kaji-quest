# routines/refill.yml — 補充（詰め替え・交換・スプレー作り）を洗剤・消耗品ごとに 1 タスクずつ
#
# ページの「補充」カードに並ぶ。補充したら 1 タップ（見込み 3 分）。
# 記録が 2 回以上あると、実際の間隔から「次はいつごろ」を出す。それまでは interval_days が目安。
# 目安の 3 日前から「そろそろ」と出る。切れて困るものは interval_days を短めにしておく。
#
#   kind: refill            → 「後から記録」ではなく「補充」カードに出す
#   group: 台所 / 洗濯 / 浴室・洗面 / トイレ / 掃除用 / 消耗品（カードの見出し）
#   interval_days: N        → 記録が少ないうちの目安の間隔（日）
#   buy: 買う物の名前       → 🛒 で買い物メモに入る名前。無ければ title から「〜の詰め替え」などを外した名前
#   schedule は manual 固定。est_minutes は 1 回分の見込み。負荷 W はすべて 1.00

# ---- 台所 ----
- id: refill-dish-soap
  title: 食器用洗剤の詰め替え
  area: nameless
  kind: refill
  group: 台所
  schedule: { type: manual }
  interval_days: 30
  est_minutes: 3
  quick_minutes: [3, 5]
  load: { physical: 1, mental: 1, time_bound: 0 }
  core: false
  checklist:
    - 詰め替えたら、ストックが最後の 1 つなら買い物メモへ
  pass_allowed: false

