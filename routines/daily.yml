# routines/daily.yml — 定期タスク定義（毎日）
#
# Phase 0（手で回す）: ここに書いた 5 件を、毎朝 Issue テンプレートから手で起票する。
# Phase 1 以降     : generate-tasks.yml がこのファイルを読んで Issue を自動生成する。
#
# スキーマは docs/SPEC.md §5.1。負荷係数 W は §6.1。
#   load.physical   1-3  身体的きつさ        (1→+0.0 / 2→+0.1  / 3→+0.2)
#   load.mental     1-3  段取り・判断の重さ  (1→+0.0 / 2→+0.15 / 3→+0.3)
#   load.time_bound 0-2  時間帯の縛り        (0→+0.0 / 1→+0.1  / 2→+0.2)
#   W = 1.0 + 各加点 / 換算時間 = est_minutes × W
#   core: true は省エネモードでも残す「絶対防衛ライン」
#   tips: ナレッジ ID（Phase 3 で追加。今は空）

- id: dishes-night
  title: 夜の洗い物リセット
  area: dishes
  schedule:
    type: cron
    expr: "0 21 * * *"          # JST 表記（Actions 側で UTC 変換）
  est_minutes: 15
  load: { physical: 2, mental: 1, time_bound: 1 }   # W=1.20 → 換算 18分
  core: true
  checklist:
    - 食器を洗う／食洗機を回す
    - シンクの水気を拭く
    - 排水口カゴを洗う
    - 三角コーナーのゴミを捨てる
  tips: []
  pass_allowed: true

- id: cooking-next-day
  title: 翌日分の仕込み
  area: cooking
  schedule:
    type: cron
    expr: "30 19 * * *"         # 帰宅後。17:00 の帰宅前リマインドで献立と不足食材を受け取る想定
  est_minutes: 45
  load: { physical: 2, mental: 3, time_bound: 1 }   # W=1.50 → 換算 68分
  core: false
  checklist:
    - 献立を決める（主菜1＋副菜1）
    - 不足食材を確認する（なければ在庫で組む）
    - 主菜を仕込む
    - 副菜を仕込む
    - 粗熱を取って冷蔵し、日付を書く
  tips: []
  pass_allowed: true

- id: bath-clean
  title: 風呂掃除
  area: cleaning
  schedule:
    type: cron
    expr: "0 7 * * *"           # 時間帯は自由（出勤前 or 入浴後）。合う方に変える
  est_minutes: 10
  load: { physical: 2, mental: 1, time_bound: 0 }   # W=1.10 → 換算 11分
  core: false
  checklist:
    - 浴槽を洗う
    - 排水口の髪の毛を取る
    - 壁・床を流して水気を切り、換気扇を回す
  tips: []
  pass_allowed: true

- id: garbage
  title: ゴミまとめ・ゴミ出し
  area: nameless
  schedule:
    type: cron
    expr: "0 7 * * *"           # 収集は朝。収集区分は自治体カレンダーに従う
  est_minutes: 5
  load: { physical: 1, mental: 2, time_bound: 2 }   # W=1.35 → 換算 7分
  core: true
  checklist:
    - 今日の収集区分を確認する
    - 各部屋のゴミを集めて袋をまとめる
    - 新しい袋をセットする
    - 収集日なら集積所へ出す
  tips: []
  pass_allowed: true

- id: work-block
  title: 作業ブロック（子ども担当）
  area: childcare
  schedule: { type: manual }    # 妻が作業を始めるタイミングで自分が起票
  est_minutes: 60               # 実績で上書き
  load: { physical: 2, mental: 2, time_bound: 2 }   # W=1.45 → 換算 87分
  attach: play_card             # 遊びネタカードをランダム添付（Phase 3）
  core: true
  checklist:
    - 何時までかを確認する
    - 作業部屋のドアを閉める／呼びに行かせない
    - 終わったら子の様子を1行記録
  tips: []
  pass_allowed: false
