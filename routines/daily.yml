# routines/daily.yml — 定期タスク定義
#
# ページ（site/）はこのファイルから「今日のタスク」と「後から記録」を組み立てる
# （デプロイ時に data/routines.json へ変換）。足す・減らす・見込みや負荷を変えるのはここだけ。
#
# スキーマは docs/SPEC.md §5.1。負荷係数 W は §6.1。
#   schedule.type: cron   → 毎日「今日のタスク」に並ぶ（expr の曜日欄で曜日指定も可）
#   schedule.type: weekly → その曜日だけ並ぶ（day: SAT など）
#   schedule.type: manual → 「後から記録」に並ぶ。quick_minutes の時間チップを 1 タップで記録
#   slots: [morning, noon, night] → 朝・昼・夜のどの欄に出すか。複数書くと欄ごとに完了を記録できる。
#           省略時は expr の時刻から自動（4〜10 時=朝 / 11〜16 時=昼 / 17 時以降=夜）
#   steps: タスクを細かく分けた手順。手順ごとに 1 タップで記録できる（id は全体で一意、est_minutes は手順 1 つ分）。
#           手順を全部記録すると親タスクも完了扱い。途中まででも「残り完了」で残りをまとめて記録できる。
#           負荷 W と領域は親から引き継ぐ。
#   load.physical   1-3  身体的きつさ        (1→+0.0 / 2→+0.1  / 3→+0.2)
#   load.mental     1-3  段取り・判断の重さ  (1→+0.0 / 2→+0.15 / 3→+0.3)
#   load.time_bound 0-2  時間帯の縛り        (0→+0.0 / 1→+0.1  / 2→+0.2)
#   W = 1.0 + 各加点 / 換算時間 = 実時間 × W
#   core: true は省エネモードでも残す「絶対防衛ライン」
#   同じタスクを 1 日に何回でも小分けに記録できる（完了 → 追加）。est_minutes は 1 回分の見込み。
#
# 2026-09-20 記録 6 日分を見て見直し: 風呂掃除とゴミは夜に記録されていたので夜へ。
# 「名もなき家事」に繰り返し入っていた朝ごはん・夜ご飯・片付けを正式なタスクに。
# 2026-09-21 全タスクを手順（steps）に細分化。洗剤の補充は routines/refill.yml で洗剤ごとに。

# ---- 朝 ----
- id: breakfast-cook
  title: 朝ごはんを作る
  area: cooking
  schedule: { type: cron, expr: "0 7 * * *" }
  slots: [morning]
  est_minutes: 15
  load: { physical: 1, mental: 2, time_bound: 1 }   # W=1.25 → 換算 19分
  core: false
  checklist:
    - 主食 + 1 品で十分。子どもの分は取り分け
  steps:
    - { id: breakfast-prep, title: 食材と食器を出す, est_minutes: 3 }
    - { id: breakfast-heat, title: 焼く・温める・盛る, est_minutes: 8 }
    - { id: breakfast-serve, title: 配膳と子どもの取り分け, est_minutes: 2 }
    - { id: breakfast-clear, title: 食卓を片付ける, est_minutes: 2 }
  pass_allowed: true

# ---- 朝と夜の両方 ----
- id: dishes
  title: 洗い物リセット
  area: dishes
  schedule: { type: cron, expr: "0 21 * * *" }
  slots: [morning, night]                            # 朝と夜で別々に完了できる
  est_minutes: 15
  load: { physical: 2, mental: 1, time_bound: 1 }   # W=1.20 → 換算 18分（1 回分）
  core: true
  checklist:
    - 食器を洗う／食洗機を回す
    - シンクの水気を拭く
    - 排水口カゴを洗う
    - 三角コーナーのゴミを捨てる
  steps:
    - { id: dishes-plates, title: 食器を洗う（食洗機に入れる）, est_minutes: 6 }
    - { id: dishes-pots, title: 鍋・フライパンを洗う, est_minutes: 3 }
    - { id: dishes-dry, title: 水切りから拭いてしまう, est_minutes: 3 }
    - { id: dishes-sink, title: シンクと排水口カゴを洗う, est_minutes: 2 }
    - { id: dishes-counter, title: コンロ・調理台を拭く, est_minutes: 1 }
  pass_allowed: true

# ---- 昼 ----
- id: menu-decide
  title: 翌日の献立を決める
  area: cooking
  schedule: { type: cron, expr: "0 12 * * *" }   # 昼休みにスマホで 5 分
  slots: [noon]
  est_minutes: 5
  load: { physical: 1, mental: 3, time_bound: 0 }   # W=1.30 → 換算 7分
  core: false
  checklist:
    - 主菜 1 つと副菜 1 つを決める
    - 足りない食材を買い物メモへ
  steps:
    - { id: menu-stock, title: 冷蔵庫の中身を思い出す・写真を見る, est_minutes: 2 }
    - { id: menu-pick, title: 主菜と副菜を決める, est_minutes: 2 }
    - { id: menu-list, title: 足りない食材を買い物メモへ, est_minutes: 1 }
  pass_allowed: true

# ---- 夜 ----
- id: dinner-cook
  title: 夜ご飯を作る
  area: cooking
  schedule: { type: cron, expr: "0 18 * * *" }
  slots: [night]
  est_minutes: 30
  load: { physical: 2, mental: 2, time_bound: 1 }   # W=1.35 → 換算 41分
  core: true
  checklist:
    - 仕込み済みのものがあれば温めるだけ
    - 作りながら使った道具を洗うと、洗い物が半分になる
  steps:
    - { id: dinner-rice, title: 米を研いで炊く, est_minutes: 3 }
    - { id: dinner-cut, title: 食材を切る, est_minutes: 8 }
    - { id: dinner-heat, title: 加熱・味付け, est_minutes: 12 }
    - { id: dinner-serve, title: 盛り付け・配膳, est_minutes: 4 }
    - { id: dinner-clear, title: 食卓の片付け・残りを保存, est_minutes: 3 }
  pass_allowed: true

- id: cooking-prep
  title: 翌日分の仕込み
  area: cooking
  schedule: { type: cron, expr: "30 19 * * *" }
  slots: [night]
  est_minutes: 45                                    # 実績の平均 45 分
  load: { physical: 2, mental: 2, time_bound: 1 }   # W=1.35 → 換算 61分
  core: false
  checklist:
    - 主菜を仕込む
    - 副菜を仕込む
    - 粗熱を取って冷蔵し、日付を書く
  steps:
    - { id: prep-veg, title: 野菜を切って保存, est_minutes: 15 }
    - { id: prep-meat, title: 肉・魚の下味, est_minutes: 10 }
    - { id: prep-side, title: 作り置きを 1 品, est_minutes: 15 }
    - { id: prep-store, title: 粗熱を取って冷蔵・日付を書く, est_minutes: 5 }
  pass_allowed: true

- id: laundry-wash
  title: 洗濯機を回す
  area: laundry
  schedule: { type: cron, expr: "0 20 * * *" }   # 朝派なら slots を [morning] に
  slots: [night]
  est_minutes: 5
  load: { physical: 1, mental: 1, time_bound: 1 }   # W=1.10 → 換算 6分
  core: true
  checklist:
    - カゴの中身をそのまま洗濯機へ（ネット物は分けてある前提）
    - 洗剤は規定量
  steps:
    - { id: laundry-collect, title: 洗濯物を集める（ポケット確認）, est_minutes: 2 }
    - { id: laundry-net, title: ネット物を分ける, est_minutes: 1 }
    - { id: laundry-start, title: 洗剤を入れて回す, est_minutes: 2 }
  pass_allowed: true

- id: laundry-hang
  title: 洗濯物を干す
  area: laundry
  schedule: { type: cron, expr: "0 21 * * *" }
  slots: [night]
  est_minutes: 10
  load: { physical: 2, mental: 1, time_bound: 1 }   # W=1.20 → 換算 12分
  core: true
  checklist:
    - 振ってしわを伸ばす
    - 間隔 10cm で干す。部屋干しなら風を当てる
  steps:
    - { id: hang-shake, title: 取り出して振ってしわを伸ばす, est_minutes: 2 }
    - { id: hang-hangers, title: ハンガー・ピンチに掛ける, est_minutes: 6 }
    - { id: hang-place, title: 干し場へ出す・風を当てる, est_minutes: 2 }
  pass_allowed: true

- id: laundry-fold-store
  title: 洗濯物を取り込んでたたむ・しまう
  area: laundry
  schedule: { type: cron, expr: "0 20 * * *" }
  slots: [night]
  est_minutes: 15
  load: { physical: 1, mental: 1, time_bound: 0 }   # W=1.00 → 換算 15分
  core: false
  checklist:
    - 乾いたものを取り込む
    - ハンガーのものはそのままクローゼットへ
    - 子ども服は引き出しに放り込む。靴下はペアにしない（同じ種類に統一）
  steps:
    - { id: fold-take, title: 取り込む, est_minutes: 3 }
    - { id: fold-fold, title: たたむ, est_minutes: 8 }
    - { id: fold-store, title: しまう, est_minutes: 4 }
  pass_allowed: true

- id: bath-clean
  title: 風呂掃除
  area: cleaning
  schedule: { type: cron, expr: "0 22 * * *" }   # 記録は夜に集中していたので夜へ。朝派なら [morning]
  slots: [night]
  est_minutes: 10
  load: { physical: 2, mental: 1, time_bound: 0 }   # W=1.10 → 換算 11分
  core: false
  checklist:
    - 浴槽を洗う
    - 排水口の髪の毛を取る
    - 壁・床を流して水気を切り、換気扇を回す
  steps:
    - { id: bath-tub, title: 浴槽を洗う, est_minutes: 4 }
    - { id: bath-hair, title: 排水口の髪の毛を取る, est_minutes: 2 }
    - { id: bath-floor, title: 床・壁を流す, est_minutes: 3 }
    - { id: bath-dry, title: 水気を切って換気扇を回す, est_minutes: 1 }
  pass_allowed: true

- id: garbage
  title: ゴミまとめ（翌朝出す分）
  area: nameless
  schedule: { type: cron, expr: "0 22 * * *" }   # まとめるのは夜。出すのは朝のついで（後から記録の「ゴミを出す」）
  slots: [night]
  est_minutes: 5
  load: { physical: 1, mental: 2, time_bound: 2 }   # W=1.35 → 換算 7分
  core: true
  checklist:
    - 明日の収集区分を確認する
    - 各部屋のゴミを集めて袋をまとめ、玄関へ
    - 新しい袋をセットする
  steps:
    - { id: garbage-check, title: 明日の収集区分を確認, est_minutes: 1 }
    - { id: garbage-collect, title: 各部屋のゴミを集める, est_minutes: 2 }
    - { id: garbage-tie, title: 袋をまとめて玄関へ, est_minutes: 1 }
    - { id: garbage-newbag, title: 新しい袋をセット, est_minutes: 1 }
  pass_allowed: true

# ---- 後から記録（時間帯は記録したときの時刻で自動。詳細で変えられる）----
- id: nameless-adhoc
  title: 名もなき家事
  area: nameless
  schedule: { type: manual }    # 「これも家事だった」を見つけたら 1 タップ。見つけたこと自体が成果
  est_minutes: 10
  quick_minutes: [3, 5, 10, 15, 30]
  load: { physical: 1, mental: 2, time_bound: 0 }   # W=1.15
  core: false
  checklist: []
  pass_allowed: false

- id: tidy-up
  title: 片付け（床の物を戻す・散らかりリセット）
  area: nameless
  schedule: { type: manual }
  est_minutes: 10
  quick_minutes: [5, 10, 15]
  load: { physical: 1, mental: 1, time_bound: 0 }   # W=1.00
  core: false
  checklist:
    - 床の物をカゴに入れるだけでも 1 回に数える
  pass_allowed: false

- id: garbage-out
  title: ゴミを出す（収集日の朝）
  area: nameless
  schedule: { type: manual }    # 収集日だけなので毎日の欄には出さない。出したら 1 タップ
  est_minutes: 2
  quick_minutes: [2, 5]
  load: { physical: 1, mental: 1, time_bound: 2 }   # W=1.20
  core: false
  checklist: []
  pass_allowed: false
