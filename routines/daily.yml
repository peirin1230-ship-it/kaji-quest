# routines/daily.yml — 定期タスク定義
#
# ページ（site/）はこのファイルから「今日のタスク」と「後から記録」を組み立てる
# （デプロイ時に data/routines.json へ変換）。足す・減らす・見込みや負荷を変えるのはここだけ。
#
# スキーマは docs/SPEC.md §5.1。負荷係数 W は §6.1。
#   schedule.type: cron   → 毎日「今日のタスク」に並ぶ（expr の曜日欄で曜日指定も可）
#   schedule.type: weekly → その曜日だけ並ぶ（day: SAT など）
#   schedule.type: manual → 「後から記録」に並ぶ。quick_minutes の時間チップを 1 タップで記録
#   slots: [morning, noon, night] → 朝・昼・夜のどの欄に出すか。複数書くと欄ごとに完了を記録できる。
#           省略時は expr の時刻から自動（4〜10 時=朝 / 11〜16 時=昼 / 17 時以降=夜）
#   load.physical   1-3  身体的きつさ        (1→+0.0 / 2→+0.1  / 3→+0.2)
#   load.mental     1-3  段取り・判断の重さ  (1→+0.0 / 2→+0.15 / 3→+0.3)
#   load.time_bound 0-2  時間帯の縛り        (0→+0.0 / 1→+0.1  / 2→+0.2)
#   W = 1.0 + 各加点 / 換算時間 = 実時間 × W
#   core: true は省エネモードでも残す「絶対防衛ライン」
#   同じタスクを 1 日に何回でも小分けに記録できる（完了 → 追加）。est_minutes は 1 回分の見込み。
#
# 2026-09-20 記録 6 日分を見て見直し: 風呂掃除とゴミは夜に記録されていたので夜へ。
# 「名もなき家事」に繰り返し入っていた朝ごはん・夜ご飯・片付けを正式なタスクに。

# ---- 朝 ----
- id: breakfast-cook
  title: 朝ごはんを作る
  area: cooking
  schedule: { type: cron, expr: "0 7 * * *" }
  slots: [morning]
  est_minutes: 15
  load: { physical: 1, mental: 2, time_bound: 1 }   # W=1.25 → 換算 19分
  core: false
  checklist:
    - 主食 + 1 品で十分。子どもの分は取り分け
  pass_allowed: true

# ---- 朝と夜の両方 ----
- id: dishes
  title: 洗い物リセット
  area: dishes
  schedule: { type: cron, expr: "0 21 * * *" }
  slots: [morning, night]                            # 朝と夜で別々に完了できる
  est_minutes: 15
  load: { physical: 2, mental: 1, time_bound: 1 }   # W=1.20 → 換算 18分（1 回分）
  core: true
  checklist:
    - 食器を洗う／食洗機を回す
    - シンクの水気を拭く
    - 排水口カゴを洗う
    - 三角コーナーのゴミを捨てる
  pass_allowed: true

# ---- 昼 ----
- id: menu-decide
  title: 翌日の献立を決める
  area: cooking
  schedule: { type: cron, expr: "0 12 * * *" }   # 昼休みにスマホで 5 分
  slots: [noon]
  est_minutes: 5
  load: { physical: 1, mental: 3, time_bound: 0 }   # W=1.30 → 換算 7分
  core: false
  checklist:
    - 主菜 1 つと副菜 1 つを決める
    - 足りない食材を買い物リストへ
  pass_allowed: true

# ---- 夜 ----
- id: dinner-cook
  title: 夜ご飯を作る
  area: cooking
  schedule: { type: cron, expr: "0 18 * * *" }
  slots: [night]
  est_minutes: 30
  load: { physical: 2, mental: 2, time_bound: 1 }   # W=1.35 → 換算 41分
  core: true
  checklist:
    - 仕込み済みのものがあれば温めるだけ
    - 作りながら使った道具を洗うと、洗い物が半分になる
  pass_allowed: true

- id: cooking-prep
  title: 翌日分の仕込み
  area: cooking
  schedule: { type: cron, expr: "30 19 * * *" }
  slots: [night]
  est_minutes: 45                                    # 実績の平均 45 分
  load: { physical: 2, mental: 2, time_bound: 1 }   # W=1.35 → 換算 61分
  core: false
  checklist:
    - 主菜を仕込む
    - 副菜を仕込む
    - 粗熱を取って冷蔵し、日付を書く
  pass_allowed: true

- id: laundry-wash
  title: 洗濯機を回す
  area: laundry
  schedule: { type: cron, expr: "0 20 * * *" }   # 朝派なら slots を [morning] に
  slots: [night]
  est_minutes: 5
  load: { physical: 1, mental: 1, time_bound: 1 }   # W=1.10 → 換算 6分
  core: true
  checklist:
    - カゴの中身をそのまま洗濯機へ（ネット物は分けてある前提）
    - 洗剤は規定量
  pass_allowed: true

- id: laundry-hang
  title: 洗濯物を干す
  area: laundry
  schedule: { type: cron, expr: "0 21 * * *" }
  slots: [night]
  est_minutes: 10
  load: { physical: 2, mental: 1, time_bound: 1 }   # W=1.20 → 換算 12分
  core: true
  checklist:
    - 振ってしわを伸ばす
    - 間隔 10cm で干す。部屋干しなら風を当てる
  pass_allowed: true

- id: laundry-fold-store
  title: 洗濯物を取り込んでたたむ・しまう
  area: laundry
  schedule: { type: cron, expr: "0 20 * * *" }
  slots: [night]
  est_minutes: 15
  load: { physical: 1, mental: 1, time_bound: 0 }   # W=1.00 → 換算 15分
  core: false
  checklist:
    - 乾いたものを取り込む
    - ハンガーのものはそのままクローゼットへ
    - 子ども服は引き出しに放り込む。靴下はペアにしない（同じ種類に統一）
  pass_allowed: true

- id: bath-clean
  title: 風呂掃除
  area: cleaning
  schedule: { type: cron, expr: "0 22 * * *" }   # 記録は夜に集中していたので夜へ。朝派なら [morning]
  slots: [night]
  est_minutes: 10
  load: { physical: 2, mental: 1, time_bound: 0 }   # W=1.10 → 換算 11分
  core: false
  checklist:
    - 浴槽を洗う
    - 排水口の髪の毛を取る
    - 壁・床を流して水気を切り、換気扇を回す
  pass_allowed: true

- id: garbage
  title: ゴミまとめ（翌朝出す分）
  area: nameless
  schedule: { type: cron, expr: "0 22 * * *" }   # まとめるのは夜。出すのは朝のついで
  slots: [night]
  est_minutes: 5
  load: { physical: 1, mental: 2, time_bound: 2 }   # W=1.35 → 換算 7分
  core: true
  checklist:
    - 明日の収集区分を確認する
    - 各部屋のゴミを集めて袋をまとめ、玄関へ
    - 新しい袋をセットする
  pass_allowed: true

# ---- 後から記録（時間帯は記録したときの時刻で自動。詳細で変えられる）----
- id: nameless-adhoc
  title: 名もなき家事
  area: nameless
  schedule: { type: manual }    # 「これも家事だった」を見つけたら 1 タップ。見つけたこと自体が成果
  est_minutes: 10
  quick_minutes: [3, 5, 10, 15, 30]
  load: { physical: 1, mental: 2, time_bound: 0 }   # W=1.15
  core: false
  checklist: []
  pass_allowed: false

- id: tidy-up
  title: 片付け（床の物を戻す・散らかりリセット）
  area: nameless
  schedule: { type: manual }
  est_minutes: 10
  quick_minutes: [5, 10, 15]
  load: { physical: 1, mental: 1, time_bound: 0 }   # W=1.00
  core: false
  checklist:
    - 床の物をカゴに入れるだけでも 1 回に数える
  pass_allowed: false

- id: detergent-refill
  title: 洗剤の補充（詰め替え）
  area: nameless
  schedule: { type: manual }    # 切れたときにやる家事。終わってから 1 タップ
  est_minutes: 5
  quick_minutes: [3, 5, 10]
  load: { physical: 1, mental: 1, time_bound: 0 }   # W=1.00
  core: false
  checklist:
    - 食器用洗剤・ハンドソープ・シャンプー・洗濯洗剤・詰め替え用のストック
    - 詰め替えたら、ストックが最後の 1 つなら買い物リストへ
  pass_allowed: false
