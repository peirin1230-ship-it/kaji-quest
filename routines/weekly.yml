# routines/weekly.yml — 週 1 回の定期タスク
#
# schedule: { type: weekly, day: SAT } のように曜日を指定すると、その曜日だけ「今日のタスク」に並ぶ。
# 不要なら項目ごと消す。曜日は MON / TUE / WED / THU / FRI / SAT / SUN。
# steps: は routines/daily.yml と同じ（手順ごとに 1 タップで記録）。

- id: daycare-laundry
  title: 保育園のシーツ・タオル類を洗って戻す
  area: laundry
  schedule: { type: weekly, day: SAT }   # 金曜に持ち帰り → 土曜に洗う → 日曜にセット、の想定
  slots: [morning]
  est_minutes: 15
  load: { physical: 1, mental: 2, time_bound: 2 }   # W=1.35 → 換算 20分
  core: false
  checklist:
    - 金曜の持ち帰り袋を全部出す
    - 名前と数を確認して洗う
    - 乾いたら月曜の袋にセット
  steps:
    - { id: daycare-unpack, title: 持ち帰り袋を全部出す, est_minutes: 2 }
    - { id: daycare-wash, title: 名前と数を確認して洗う, est_minutes: 5 }
    - { id: daycare-hang, title: 干す, est_minutes: 4 }
    - { id: daycare-pack, title: 乾いたら月曜の袋にセット, est_minutes: 4 }
  tips: []
  pass_allowed: true
